# Builds the Windows installer and the Mac disk image (each with its own Node.js) and attaches them to a GitHub release: one download per system.
# Run it by pushing a version tag:   git tag v1.1.0 && git push origin v1.1.0
# If a release for that tag already exists (for example one published by hand with the same files), it does nothing.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:            # a dry run: builds everything and keeps it as a download, publishes nothing
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there already a release for this tag?
        id: check
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $GITHUB_REF_NAME already exists; nothing to do."; fi
      - if: steps.check.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - if: steps.check.outputs.exists != 'true'
        run: npm test
      - if: steps.check.outputs.exists != 'true'
        name: Install NSIS (builds the Windows installer)
        run: brew install makensis
      - if: steps.check.outputs.exists != 'true'
        run: node tools/build-packages.js --require-installers
      - if: steps.check.outputs.exists != 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mavlink-hub-downloads
          path: dist/*
      - if: steps.check.outputs.exists != 'true' && github.ref_type == 'tag'
        name: Publish the release
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/MAVLink-Hub-Setup.exe dist/MAVLink-Hub.dmg dist/SHA256SUMS.txt
          --title "MAVLink Hub $GITHUB_REF_NAME" --generate-notes
